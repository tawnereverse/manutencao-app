<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Atlantica</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <img src="./logo.png" class="brand-logo" alt="Logo Atlantica">
    <h1>Login</h1>
    <p class="muted">Acesse com seu e-mail e senha cadastrados no Supabase Auth.</p>

    <form id="login-form" class="stack-form">
      <label class="field">
        <span>E-mail</span>
        <input id="email" type="email" required autocomplete="email" placeholder="voce@empresa.com">
      </label>

      <label class="field">
        <span>Senha</span>
        <input id="password" type="password" required autocomplete="current-password" placeholder="********">
      </label>

      <button id="login-btn" type="submit">Entrar</button>
    </form>
    <p id="login-feedback" class="message hidden" role="status" aria-live="polite"></p>
  </main>

  <script src="/api/public-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/login.js"></script>
</body>
</html>
