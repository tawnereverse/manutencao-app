<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  font-family: Arial;
  background: #1e3a8a;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.box {
  background: white;
  padding: 30px;
  border-radius: 10px;
  width: 300px;
  text-align: center;
}

input, button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
}
</style>
</head>

<body>

<div class="box">
  <h2>Login Admin</h2>
  <input id="user" placeholder="Usuário">
  <input id="pass" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<script>
function login() {
  if (user.value === "admin" && pass.value === "123") {
    window.location.href = "admin.html";
  } else {
    alert("Login inválido");
  }
}
</script>

</body>
</html>
