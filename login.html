<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Atlantica</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <img src="./logo.png" class="brand-logo" alt="Logo Atlantica">
    <h1>Login</h1>
    <p class="muted">Acesse com usuario e senha. Admin padrao: admin / 123.</p>

    <form id="login-form" class="stack-form">
      <label class="field">
        <span>Usuario</span>
        <input id="user" required autocomplete="username" placeholder="Seu usuario">
      </label>

      <label class="field">
        <span>Senha</span>
        <input id="pass" type="password" required autocomplete="current-password" placeholder="********">
      </label>

      <button id="login-btn" type="submit">Entrar</button>
    </form>
    <p id="login-feedback" class="message hidden" role="status" aria-live="polite"></p>
  </main>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
