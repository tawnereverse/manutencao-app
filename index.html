<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chamados Manutenção</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <img src="logo.png" class="logo">

  <h2>Abertura de Chamado Manutenção Grupo Atlântica</h2>

  <input id="nome" placeholder="Nome">

  <select id="unidade">
    <option value="">Selecione a Unidade</option>
    <option>Atlântica Matriz</option>
    <option>CD Kasa Granitos</option>
    <option>Max Vidros</option>
    <option>Perfilmaster</option>
    <option>Uvolt Solar</option>
  </select>

  <input id="setor" placeholder="Setor">

  <!-- LIMITE DE 200 -->
  <textarea id="descricao" maxlength="200" placeholder="Descreva o problema (máx 200 caracteres)"></textarea>

  <select id="prioridade">
    <option>Baixa</option>
    <option>Média</option>
    <option>Alta</option>
  </select>

  <input type="file" id="foto">

  <button onclick="enviar()">Enviar Chamado</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://kmxmyjvxncteacojmbaj.supabase.co",
  "sb_publishable_OuujR_q1W9R1q9-MJuHPIg_a89r7Y9J"
);

async function enviar() {
  let nome = document.getElementById("nome").value.trim();
  let unidade = document.getElementById("unidade").value;
  let setor = document.getElementById("setor").value.trim();
  let descricao = document.getElementById("descricao").value.trim();
  let prioridade = document.getElementById("prioridade").value;

  if (!unidade) {
    alert("Selecione a unidade");
    return;
  }

  let file = document.getElementById("foto").files[0];
  let foto_url = null;

  if (file) {
    let nomeArquivo = Date.now() + "_" + file.name;

    let { error: uploadError } = await supabaseClient.storage
      .from("fotos")
      .upload(nomeArquivo, file);

    if (uploadError) {
      alert(uploadError.message);
      return;
    }

    foto_url = `https://kmxmyjvxncteacojmbaj.supabase.co/storage/v1/object/public/fotos/${nomeArquivo}`;
  }

  let { error } = await supabaseClient.from("chamados").insert([{
    nome,
    unidade,
    setor,
    descricao,
    prioridade,
    status: "Aberto",
    foto_url
  }]);

  if (error) {
    alert(error.message);
    return;
  }

  alert("Chamado enviado com sucesso!");

  document.getElementById("nome").value = "";
  document.getElementById("unidade").value = "";
  document.getElementById("setor").value = "";
  document.getElementById("descricao").value = "";
}
</script>

</body>
</html>
