<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abertura de Chamado | Atlantica</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="app-page">
  <header class="top-header">
    <img src="./logo.png" class="brand-logo" alt="Logo Atlantica">
    <div class="header-user">
      <p id="user-name" class="user-name">Carregando...</p>
      <p id="user-role" class="user-role"></p>
    </div>
    <div class="header-actions">
      <button id="go-panel" class="btn-secondary hidden" type="button">Abrir painel</button>
      <button id="logout-btn" class="btn-danger" type="button">Sair</button>
    </div>
  </header>

  <main class="page-grid single-column">
    <section class="card">
      <h1>Abertura de Chamado</h1>
      <p class="muted">Preencha os campos para registrar o atendimento.</p>

      <form id="ticket-form" class="stack-form">
        <label class="field">
          <span>Nome</span>
          <input id="nome" maxlength="80" required placeholder="Seu nome">
        </label>

        <label class="field">
          <span>Email</span>
          <input id="email" type="email" maxlength="254" required placeholder="voce@empresa.com">
        </label>

        <label class="field">
          <span>Unidade</span>
          <select id="unidade" required>
            <option value="">Selecione</option>
            <option value="Atlantica Matriz">Atlantica Matriz</option>
            <option value="CD Kasa Granitos">CD Kasa Granitos</option>
            <option value="Max Vidros">Max Vidros</option>
            <option value="Perfilmaster">Perfilmaster</option>
            <option value="Uvolt Solar">Uvolt Solar</option>
          </select>
        </label>

        <label class="field">
          <span>Setor</span>
          <input id="setor" maxlength="80" required placeholder="Ex.: Financeiro">
        </label>

        <label class="field">
          <span>Descricao do problema</span>
          <textarea id="descricao" maxlength="500" required placeholder="Descreva o problema com detalhes"></textarea>
        </label>

        <label class="field">
          <span>Prioridade</span>
          <select id="prioridade" required>
            <option value="normal">Normal</option>
            <option value="urgente">Urgente</option>
          </select>
        </label>

        <button id="submit-ticket-btn" type="submit">Enviar chamado</button>
      </form>
      <p id="ticket-feedback" class="message hidden" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="/api/public-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/index.js"></script>
</body>
</html>
