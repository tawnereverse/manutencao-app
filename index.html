<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abertura de Chamado | Atlantica</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="app-page">
  <header class="top-header">
    <img src="./logo.png" class="brand-logo" alt="Logo Atlantica">
    <div class="header-actions">
      <a href="./login.html" class="as-button btn-secondary">Acessar painel</a>
    </div>
  </header>

  <main class="page-grid single-column">
    <section class="card">
      <h1>Abertura de Chamado</h1>
      <p class="muted">Preencha os campos para registrar o atendimento.</p>

      <form id="ticket-form" class="stack-form">
        <label class="field">
          <span>Nome</span>
          <input id="nome" maxlength="80" required placeholder="Seu nome completo">
        </label>

        <label class="field">
          <span>Email</span>
          <input id="email" type="email" maxlength="254" required placeholder="voce@empresa.com">
        </label>

        <label class="field">
          <span>Unidade</span>
          <select id="unidade" required>
            <option value="">Selecione</option>
            <option value="Atlantica Matriz">Atlantica Matriz</option>
            <option value="CD Kasa Granitos">CD Kasa Granitos</option>
            <option value="Max Vidros">Max Vidros</option>
            <option value="Perfilmaster">Perfilmaster</option>
            <option value="Uvolt Solar">Uvolt Solar</option>
          </select>
        </label>

        <label class="field">
          <span>Setor</span>
          <input id="setor" maxlength="80" required placeholder="Ex.: Financeiro">
        </label>

        <label class="field">
          <span>Descricao do problema</span>
          <textarea id="descricao" maxlength="500" required placeholder="Descreva o problema com detalhes"></textarea>
        </label>

        <label class="field">
          <span>Prioridade</span>
          <select id="prioridade" required>
            <option value="normal">Normal</option>
            <option value="urgente">Urgente</option>
          </select>
        </label>

        <button id="submit-ticket-btn" type="submit">Enviar chamado</button>
      </form>
      <p id="ticket-feedback" class="message hidden" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const form = document.getElementById("ticket-form");
    const feedback = document.getElementById("ticket-feedback");
    const submitButton = document.getElementById("submit-ticket-btn");

    const fields = {
      nome: document.getElementById("nome"),
      email: document.getElementById("email"),
      unidade: document.getElementById("unidade"),
      setor: document.getElementById("setor"),
      descricao: document.getElementById("descricao"),
      prioridade: document.getElementById("prioridade")
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearFeedback();

      const payload = {
        nome: sanitize(fields.nome.value),
        email: String(fields.email.value || "").trim().toLowerCase(),
        unidade: fields.unidade.value,
        setor: sanitize(fields.setor.value),
        descricao: sanitize(fields.descricao.value),
        prioridade: fields.prioridade.value
      };

      if (!payload.nome || !payload.email || !payload.unidade || !payload.setor || !payload.descricao || !payload.prioridade) {
        setFeedback("Preencha todos os campos obrigatorios.", "error");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Enviando...";

      try {
        const { response, body } = await requestChamados("POST", payload);
        if (!response || !response.ok) {
          throw new Error(body.error || body.raw || "Falha ao abrir chamado.");
        }

        const numero = body.numero ? `#${body.numero}` : "(sem numero)";
        setFeedback(`Chamado ${numero} aberto com sucesso. Guarde esse numero.`, "success");
        form.reset();
      } catch (error) {
        setFeedback(error.message || "Falha ao abrir chamado.", "error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Enviar chamado";
      }
    });

    function sanitize(value) {
      return String(value || "").replace(/\s+/g, " ").trim();
    }

    function setFeedback(message, type) {
      feedback.textContent = message;
      feedback.classList.remove("hidden", "info", "success", "error");
      feedback.classList.add(type);
    }

    function clearFeedback() {
      feedback.textContent = "";
      feedback.classList.add("hidden");
      feedback.classList.remove("info", "success", "error");
    }

    async function parseApiBody(response) {
      const text = await response.text();
      if (!text) return {};
      try {
        return JSON.parse(text);
      } catch {
        return { raw: text.slice(0, 240) };
      }
    }

    async function requestChamados(method, payload) {
      const endpoints = ["/api/chamados", "/api/tickets"];
      let lastBody = { error: "Nenhum endpoint respondeu." };
      let lastResponse = null;

      for (const endpoint of endpoints) {
        try {
          const response = await fetch(endpoint, {
            method,
            headers: { "Content-Type": "application/json" },
            body: payload ? JSON.stringify(payload) : undefined
          });
          const body = await parseApiBody(response);
          if (response.ok || response.status !== 404) {
            return { response, body };
          }
          lastBody = body;
          lastResponse = response;
        } catch (error) {
          lastBody = { error: error.message || "Falha de rede." };
          lastResponse = null;
        }
      }

      return { response: lastResponse, body: lastBody };
    }
  </script>
</body>
</html>
