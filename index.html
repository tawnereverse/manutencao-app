<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  background: #1e3a8a;
  margin: 0;
  text-align: center;
}

.container {
  max-width: 500px;
  margin: 20px auto;
  background: white;
  color: #1e3a8a;
  padding: 20px;
  border-radius: 10px;
}

.logo {
  width: 120px;
  margin-bottom: 10px;
}

input, select, textarea, button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  background: #2563eb;
  color: white;
  border: none;
}
</style>
</head>

<body>

<div class="container">
  <img src="logo.png" class="logo">

  <h2>Abertura de Chamado</h2>

  <input id="nome" placeholder="Seu nome">

  <select id="unidade">
    <option value="">Selecione a unidade</option>
    <option>Atlântica Matriz</option>
    <option>CD Kasa Granitos</option>
    <option>Max Vidros</option>
    <option>Perfilmaster</option>
    <option>Uvolt Solar</option>
  </select>

  <input id="setor" placeholder="Setor">

  <textarea id="descricao" maxlength="200" placeholder="Descreva o problema"></textarea>

  <select id="prioridade">
    <option>Normal</option>
    <option>Urgente</option>
  </select>

  <button onclick="enviar()">Enviar</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://kmxmyjvxncteacojmbaj.supabase.co",
  "sb_publishable_OuujR_q1W9R1q9-MJuHPIg_a89r7Y9J"
);

async function enviar() {
  await supabaseClient.from("chamados").insert([{
    nome: nome.value,
    unidade: unidade.value,
    setor: setor.value,
    descricao: descricao.value,
    prioridade: prioridade.value,
    status: "Aberto"
  }]);

  alert("Chamado enviado!");
}
</script>

</body>
</html>
