<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel Admin</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container" id="loginBox">
  <h2>Login</h2>
  <input id="email" placeholder="Email">
  <input id="senha" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<div class="container" id="adminBox" style="display:none;">
  <h2>Painel de Chamados</h2>

  <button onclick="logout()">Sair</button>

  <h3>Criar Usuário</h3>
  <input id="novoEmail" placeholder="Email">
  <input id="novaSenha" type="password" placeholder="Senha">
  <button onclick="criarUsuario()">Criar</button>

  <br><br>

  <table id="tabela"></table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://kmxmyjvxncteacojmbaj.supabase.co",
  "sb_publishable_OuujR_q1W9R1q9-MJuHPIg_a89r7Y9J"
);

// LOGIN
async function login() {
  const { error } = await supabaseClient.auth.signInWithPassword({
    email: document.getElementById("email").value,
    password: document.getElementById("senha").value
  });

  if (error) return alert("Erro login");

  iniciarPainel();
}

// LOGOUT
async function logout() {
  await supabaseClient.auth.signOut();
  location.reload();
}

// CRIAR USUÁRIO
async function criarUsuario() {
  const { error } = await supabaseClient.auth.signUp({
    email: document.getElementById("novoEmail").value,
    password: document.getElementById("novaSenha").value
  });

  if (error) alert("Erro ao criar usuário");
  else alert("Usuário criado!");
}

// INICIAR PAINEL
async function iniciarPainel() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("adminBox").style.display = "block";
  carregar();
}

// CARREGAR CHAMADOS
async function carregar() {
  let { data } = await supabaseClient
    .from("chamados")
    .select("*")
    .order("created_at", { ascending: false });

  let html = `
    <tr>
      <th>Setor</th>
      <th>Problema</th>
      <th>Foto</th>
      <th>Status</th>
    </tr>
  `;

  data.forEach(c => {
    html += `
      <tr>
        <td>${c.setor}</td>
        <td>${c.descricao}</td>
        <td>${c.foto_url ? `<img src="${c.foto_url}" width="80">` : ""}</td>
        <td>${c.status}</td>
      </tr>
    `;
  });

  document.getElementById("tabela").innerHTML = html;
}

// VERIFICAR LOGIN AO ABRIR
supabaseClient.auth.getSession().then(({ data }) => {
  if (data.session) iniciarPainel();
});
</script>

</body>
</html>
