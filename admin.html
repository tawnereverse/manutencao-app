<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  background: #1e3a8a;
  margin: 0;
}

.container {
  max-width: 950px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 16px;
  position: relative;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.logout {
  position: absolute;
  top: 15px;
  right: 15px;
  background: #ef4444;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
}

.logo {
  width: 120px;
  display: block;
  margin: auto;
}

.card {
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: white;
  padding: 14px;
  margin-top: 12px;
  text-align: center;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
}

.chamado {
  border: 1px solid #ddd;
  padding: 15px;
  margin-top: 12px;
  border-radius: 10px;
  background: #fafafa;
}

.final {
  background: #eef6ff;
  padding: 12px;
  margin-top: 10px;
  display: none;
  border-radius: 8px;
}

input, select, textarea {
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
  margin-top: 5px;
  width: 100%;
  box-sizing: border-box;
}

textarea {
  height: 100px;
  resize: none;
}

button {
  margin-top: 8px;
  padding: 8px 12px;
  border: none;
  background: #2563eb;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

.top-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.top-bar input {
  flex: 1;
}
</style>

</head>

<body>

<div class="container">

<button class="logout" onclick="logout()">Sair</button>

<img src="logo.png" class="logo">
<h2 style="text-align:center;">Painel</h2>

<div class="top-bar">
  <input id="busca" placeholder="Buscar nº do chamado">
  <button onclick="buscar()">Buscar</button>
</div>

<div id="dashboard"></div>

<button onclick="verFinalizados()">Finalizados</button>

<div id="lista"></div>

<hr>

<h3>Criar usuário</h3>
<input id="novo_user" placeholder="Usuário">
<input id="novo_pass" placeholder="Senha">
<button onclick="criarUsuario()">Criar</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

// PROTEÇÃO
if (localStorage.getItem("logado") !== "sim") {
  location.href = "login.html";
}

const db = supabase.createClient(
  "https://kmxmyjvxncteacojmbaj.supabase.co",
  "sb_publishable_OuujR_q1W9R1q9-MJuHPIg_a89r7Y9J"
);

let dados = [];
let statusAtual = "Aberto";

// LOGOUT
function logout() {
  localStorage.removeItem("logado");
  location.href = "login.html";
}

// CARREGAR
async function load() {
  let { data } = await db.from("chamados").select("*").order("numero");
  dados = data;

  dashboard.innerHTML = `
    <div class="card" onclick="filtro('Aberto')">Abertos: ${data.filter(x=>x.status=='Aberto').length}</div>
    <div class="card" onclick="filtro('Andamento')">Andamento: ${data.filter(x=>x.status=='Andamento').length}</div>
  `;

  render();
}

// FILTRO
function filtro(s) {
  statusAtual = s;
  render();
}

// RENDER
function render() {
  let listaFiltrada = dados.filter(x=>x.status==statusAtual);

  if (!listaFiltrada.length) {
    lista.innerHTML = "Nenhum chamado";
    return;
  }

  let html = "";

  listaFiltrada.forEach(c => {
    html += `
      <div class="chamado">
        <b>#${c.numero}</b><br>
        ${c.descricao}<br>
        <small>${c.unidade} | ${c.setor} | ${c.nome}</small><br><br>

        <select onchange="mudar('${c.id}',this.value)">
          <option ${c.status=="Aberto"?"selected":""}>Aberto</option>
          <option ${c.status=="Andamento"?"selected":""}>Andamento</option>
          <option>Finalizado</option>
        </select>

        <div id="f_${c.id}" class="final">
          
          <label>Atendido por</label>
          <select id="nome_${c.id}">
            <option value="">Selecione</option>
            <option>Maicon</option>
            <option>Marcelo</option>
            <option>Daniel</option>
            <option>Vinicius</option>
          </select>

          <label>Solução</label>
          <textarea id="sol_${c.id}" maxlength="200" placeholder="Descreva a solução (máx 200 caracteres)"></textarea>

          <button onclick="finalizar('${c.id}')">Salvar</button>
        </div>
      </div>
    `;
  });

  lista.innerHTML = html;
}

// STATUS
function mudar(id,status) {
  if (status=="Finalizado") {
    document.getElementById("f_"+id).style.display="block";
  } else {
    update(id,status);
  }
}

// FINALIZAR
async function finalizar(id){
  let nome = document.getElementById("nome_"+id).value;
  let sol = document.getElementById("sol_"+id).value;

  if(!nome || !sol) return alert("Preencha todos os campos");
  if(sol.length > 200) return alert("Máximo 200 caracteres");

  await db.from("chamados").update({
    status:"Finalizado",
    atendido_por:nome,
    solucao:sol
  }).eq("id",id);

  load();
}

// UPDATE
async function update(id,status){
  await db.from("chamados").update({status}).eq("id",id);
  load();
}

// FINALIZADOS
function verFinalizados(){
  let html = "<h3>Finalizados</h3>";

  dados.filter(x=>x.status=="Finalizado").forEach(c=>{
    html+=`
      <div class="chamado" onclick="toggle('${c.id}')" style="cursor:pointer">
        <b>#${c.numero}</b> - ${c.descricao}
        <div id="d_${c.id}" class="final">
          <b>Atendido por:</b> ${c.atendido_por}<br><br>
          <b>Solução:</b><br>${c.solucao}
        </div>
      </div>
    `;
  });

  lista.innerHTML = html;
}

// DETALHE
function toggle(id){
  let el = document.getElementById("d_"+id);
  el.style.display = el.style.display=="block"?"none":"block";
}

// BUSCAR
function buscar(){
  let n = busca.value;
  let c = dados.find(x=>x.numero==n);

  if(!c) return alert("Não encontrado");

  lista.innerHTML = `
    <div class="chamado">
      <b>#${c.numero}</b><br>
      ${c.descricao}<br><br>
      <b>Status:</b> ${c.status}<br>
      <b>Atendido por:</b> ${c.atendido_por || "-"}<br>
      <b>Solução:</b> ${c.solucao || "-"}
    </div>
  `;
}

// CRIAR USUÁRIO
async function criarUsuario(){
  let user = document.getElementById("novo_user").value;
  let pass = document.getElementById("novo_pass").value;

  if(!user || !pass) return alert("Preencha");

  await db.from("usuarios").insert([
    { usuario: user, senha: pass }
  ]);

  alert("Usuário criado!");
}

// INIT
load();

</script>

</body>
</html>
