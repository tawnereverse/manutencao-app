<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel Admin</title>

  <link rel="stylesheet" href="style.css">

  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      margin-top: 20px;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
    }

    th {
      background: #1e3a8a;
      color: white;
    }

    img {
      border-radius: 6px;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div class="container" id="loginBox">
  <h2>Login</h2>
  <input id="login" placeholder="Usuário">
  <input id="senha" type="password" placeholder="Senha">
  <button onclick="entrar()">Entrar</button>
</div>

<!-- ADMIN -->
<div class="container" id="adminBox" style="display:none;">
  <h2>Painel de Chamados</h2>

  <button onclick="logout()">Sair</button>

  <h3>Criar Usuário</h3>
  <input id="novoLogin" placeholder="Usuário">
  <input id="novaSenha" type="password" placeholder="Senha">
  <button onclick="criarUsuario()">Criar</button>

  <table id="tabela"></table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://kmxmyjvxncteacojmbaj.supabase.co",
  "sb_publishable_OuujR_q1W9R1q9-MJuHPIg_a89r7Y9J"
);

// 🔐 LOGIN CORRIGIDO
async function entrar() {
  let login = document.getElementById("login").value.trim();
  let senha = document.getElementById("senha").value.trim();

  let { data, error } = await supabaseClient
    .from("usuarios")
    .select("*")
    .eq("login", login)
    .eq("senha", senha);

  console.log("Resultado login:", data);

  if (error || !data || data.length === 0) {
    alert("Login inválido");
    return;
  }

  localStorage.setItem("logado", "sim");
  iniciarPainel();
}

// 🚪 LOGOUT
function logout() {
  localStorage.removeItem("logado");
  location.reload();
}

// 👤 CRIAR USUÁRIO
async function criarUsuario() {
  let login = document.getElementById("novoLogin").value.trim();
  let senha = document.getElementById("novaSenha").value.trim();

  if (!login || !senha) {
    alert("Preencha login e senha");
    return;
  }

  await supabaseClient.from("usuarios").insert([{
    login: login,
    senha: senha
  }]);

  alert("Usuário criado!");
}

// 🚀 INICIAR PAINEL
function iniciarPainel() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("adminBox").style.display = "block";
  carregar();
}

// 📊 CARREGAR CHAMADOS
async function carregar() {
  let { data } = await supabaseClient
    .from("chamados")
    .select("*")
    .order("created_at", { ascending: false });

  let html = `
    <tr>
      <th>Setor</th>
      <th>Problema</th>
      <th>Foto</th>
      <th>Status</th>
    </tr>
  `;

  data.forEach(c => {
    html += `
      <tr>
        <td>${c.setor}</td>
        <td>${c.descricao}</td>
        <td>${c.foto_url ? `<img src="${c.foto_url}" width="80">` : "-"}</td>
        <td>${c.status}</td>
      </tr>
    `;
  });

  document.getElementById("tabela").innerHTML = html;
}

// 🔄 AUTO LOGIN
if (localStorage.getItem("logado") === "sim") {
  iniciarPainel();
}
</script>

</body>
</html>
