<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel Admin</title>

  <link rel="stylesheet" href="style.css">

  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      margin-top: 20px;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
    }

    th {
      background: #1e3a8a;
      color: white;
    }

    .status-Aberto { color: red; font-weight: bold; }
    .status-Andamento { color: orange; font-weight: bold; }
    .status-Finalizado { color: green; font-weight: bold; }
  </style>
</head>

<body>

<div class="container" id="loginBox">
  <h2>Login</h2>
  <input id="login" placeholder="Usuário">
  <input id="senha" type="password" placeholder="Senha">
  <button onclick="entrar()">Entrar</button>
</div>

<div class="container" id="adminBox" style="display:none;">
  <h2>Painel de Chamados</h2>

  <button onclick="logout()">Sair</button>

  <!-- ADMIN -->
  <div id="blocoUsuarios">
    <h3>Criar Usuário</h3>
    <input id="novoLogin" placeholder="Usuário">
    <input id="novaSenha" type="password" placeholder="Senha">
    <select id="tipoUsuario">
      <option value="comum">Comum</option>
      <option value="admin">Admin</option>
    </select>
    <button onclick="criarUsuario()">Criar</button>
  </div>

  <br>

  <select id="filtro" onchange="carregar()">
    <option value="">Todos</option>
    <option value="Aberto">Aberto</option>
    <option value="Andamento">Andamento</option>
    <option value="Finalizado">Finalizado</option>
  </select>

  <table id="tabela"></table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://kmxmyjvxncteacojmbaj.supabase.co",
  "sb_publishable_OuujR_q1W9R1q9-MJuHPIg_a89r7Y9J"
);

// LOGIN
async function entrar() {
  let login = document.getElementById("login").value.trim();
  let senha = document.getElementById("senha").value.trim();

  let { data } = await supabaseClient
    .from("usuarios")
    .select("*")
    .eq("login", login)
    .eq("senha", senha);

  if (!data || data.length === 0) {
    alert("Login inválido");
    return;
  }

  let usuario = data[0];

  localStorage.setItem("logado", "sim");
  localStorage.setItem("tipo", usuario.tipo);

  iniciarPainel();
}

// LOGOUT
function logout() {
  localStorage.clear();
  location.reload();
}

// CRIAR USUÁRIO
async function criarUsuario() {
  let login = document.getElementById("novoLogin").value;
  let senha = document.getElementById("novaSenha").value;
  let tipo = document.getElementById("tipoUsuario").value;

  await supabaseClient.from("usuarios").insert([{
    login,
    senha,
    tipo
  }]);

  alert("Usuário criado!");
}

// INICIAR
function iniciarPainel() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("adminBox").style.display = "block";

  let tipo = localStorage.getItem("tipo");

  if (tipo !== "admin") {
    document.getElementById("blocoUsuarios").style.display = "none";
  }

  carregar();
}

// ALTERAR STATUS
async function atualizarStatus(id, status) {
  await supabaseClient
    .from("chamados")
    .update({ status })
    .eq("id", id);

  carregar();
}

// CARREGAR
async function carregar() {
  let filtro = document.getElementById("filtro").value;

  let query = supabaseClient
    .from("chamados")
    .select("*")
    .order("created_at", { ascending: false });

  if (filtro) {
    query = query.eq("status", filtro);
  }

  let { data } = await query;

  let html = `
    <tr>
      <th>Unidade</th>
      <th>Setor</th>
      <th>Problema</th>
      <th>Foto</th>
      <th>Status</th>
      <th>Ação</th>
    </tr>
  `;

  data.forEach(c => {
    html += `
      <tr>
        <td>${c.unidade || "-"}</td>
        <td>${c.setor}</td>
        <td>${c.descricao}</td>
        <td>${c.foto_url ? `<img src="${c.foto_url}" width="60">` : "-"}</td>
        <td class="status-${c.status}">${c.status}</td>
        <td>
          <select onchange="atualizarStatus('${c.id}', this.value)">
            <option ${c.status=="Aberto"?"selected":""}>Aberto</option>
            <option ${c.status=="Andamento"?"selected":""}>Andamento</option>
            <option ${c.status=="Finalizado"?"selected":""}>Finalizado</option>
          </select>
        </td>
      </tr>
    `;
  });

  document.getElementById("tabela").innerHTML = html;
}

// AUTO LOGIN
if (localStorage.getItem("logado") === "sim") {
  iniciarPainel();
}
</script>

</body>
</html>
