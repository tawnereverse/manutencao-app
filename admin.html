<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel</title>

<style>
body {
  font-family: Arial;
  background: #1e3a8a;
}

.container {
  max-width: 900px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 10px;
}

.logo {
  display: block;
  margin: auto;
  width: 120px;
}

.card {
  background: #3b82f6;
  color: white;
  padding: 15px;
  margin: 10px 0;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
}

.chamado {
  border: 1px solid #ddd;
  padding: 10px;
  margin-top: 10px;
}

.urgente {
  color: red;
  font-weight: bold;
}

select, textarea, button {
  width: 100%;
  margin-top: 5px;
  padding: 8px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
}

</style>
</head>

<body>

<div class="container">
  <img src="logo.png" class="logo">

  <h2>Painel</h2>

  <div id="dashboard"></div>

  <div id="filtroUnidade" style="display:none;">
    <select id="unidadeSelect" onchange="carregarChamados()"></select>
  </div>

  <div id="lista"></div>

  <button onclick="logout()">Sair</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://kmxmyjvxncteacojmbaj.supabase.co",
  "sb_publishable_OuujR_q1W9R1q9-MJuHPIg_a89r7Y9J"
);

let statusSelecionado = "";

// DASHBOARD
async function carregarDashboard() {
  let { data } = await supabaseClient.from("chamados").select("*");

  let abertos = data.filter(c => c.status === "Aberto").length;
  let andamento = data.filter(c => c.status === "Andamento").length;

  document.getElementById("dashboard").innerHTML = `
    <div class="card" onclick="filtrarStatus('Aberto')">Abertos: ${abertos}</div>
    <div class="card" onclick="filtrarStatus('Andamento')">Andamento: ${andamento}</div>
  `;
}

// FILTRO STATUS
function filtrarStatus(status) {
  statusSelecionado = status;
  document.getElementById("filtroUnidade").style.display = "block";
  carregarUnidades();
}

// UNIDADES
async function carregarUnidades() {
  let { data } = await supabaseClient.from("chamados").select("unidade");

  let unidades = [...new Set(data.map(c => c.unidade))];

  let select = document.getElementById("unidadeSelect");

  select.innerHTML = "<option value=''>Selecione unidade</option>";

  unidades.forEach(u => {
    select.innerHTML += `<option>${u}</option>`;
  });
}

// CHAMADOS
async function carregarChamados() {
  let unidade = document.getElementById("unidadeSelect").value;

  let { data } = await supabaseClient
    .from("chamados")
    .select("*")
    .eq("status", statusSelecionado)
    .eq("unidade", unidade);

  let html = "";

  data.forEach(c => {
    html += `
      <div class="chamado">
        <b>${c.descricao}</b><br>
        <span class="${c.prioridade === 'Urgente' ? 'urgente' : ''}">
          ${c.prioridade}
        </span>

        <select onchange="mudarStatus('${c.id}', this.value)">
          <option ${c.status=="Aberto"?"selected":""}>Aberto</option>
          <option ${c.status=="Andamento"?"selected":""}>Andamento</option>
          <option>Finalizado</option>
        </select>

        <div id="finalizar_${c.id}" style="display:none;">
          <select id="nome_${c.id}">
            <option value="">Atendido por</option>
            <option>Maicon</option>
            <option>Marcelo</option>
            <option>Vinicius</option>
            <option>Daniel</option>
          </select>

          <textarea id="solucao_${c.id}" maxlength="200"></textarea>

          <button onclick="finalizar('${c.id}')">Confirmar</button>
        </div>
      </div>
    `;
  });

  document.getElementById("lista").innerHTML = html;
}

// STATUS
function mudarStatus(id, status) {
  if (status === "Finalizado") {
    document.getElementById("finalizar_" + id).style.display = "block";
  } else {
    atualizarStatus(id, status);
  }
}

// FINALIZAR
async function finalizar(id) {
  let nome = document.getElementById("nome_" + id).value;
  let solucao = document.getElementById("solucao_" + id).value;

  if (!nome || !solucao) {
    alert("Preencha tudo");
    return;
  }

  await supabaseClient
    .from("chamados")
    .update({
      status: "Finalizado",
      atendido_por: nome,
      solucao
    })
    .eq("id", id);

  alert("Finalizado!");

  carregarChamados();
  carregarDashboard();
}

// STATUS DIRETO
async function atualizarStatus(id, status) {
  await supabaseClient.from("chamados").update({ status }).eq("id", id);
  carregarChamados();
}

// LOGOUT
function logout() {
  location.reload();
}

// INICIO
carregarDashboard();
</script>

</body>
</html>
