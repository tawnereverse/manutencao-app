<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; background: #1e3a8a; margin: 0; }

.container {
  max-width: 900px;
  margin: 20px auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
  position: relative;
}

.logout {
  position: absolute;
  top: 10px;
  right: 10px;
  background: #ef4444;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
}

.logo {
  width: 120px;
  display: block;
  margin: auto;
}

.card {
  background: #2563eb;
  color: white;
  padding: 12px;
  margin-top: 10px;
  text-align: center;
  border-radius: 8px;
  cursor: pointer;
}

.chamado {
  border: 1px solid #ddd;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
}

.final {
  background: #eef6ff;
  padding: 10px;
  margin-top: 10px;
  display: none;
}
</style>

</head>

<body>

<div class="container">

<button class="logout" onclick="logout()">Sair</button>

<img src="logo.png" class="logo">
<h2 style="text-align:center;">Painel</h2>

<input id="busca" placeholder="Buscar nº">
<button onclick="buscar()">Buscar</button>

<div id="dashboard"></div>

<button onclick="verFinalizados()">Finalizados</button>

<div id="lista"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

// PROTEÇÃO
if (localStorage.getItem("logado") !== "sim") {
  location.href = "login.html";
}

const db = supabase.createClient(
  "https://kmxmyjvxncteacojmbaj.supabase.co",
  "sb_publishable_OuujR_q1W9R1q9-MJuHPIg_a89r7Y9J"
);

let dados = [];
let statusAtual = "Aberto";

// LOGOUT
function logout() {
  localStorage.removeItem("logado");
  location.href = "login.html";
}

// CARREGAR
async function load() {
  let { data } = await db.from("chamados").select("*").order("numero");

  dados = data;

  dashboard.innerHTML = `
    <div class="card" onclick="filtro('Aberto')">Abertos: ${data.filter(x=>x.status=='Aberto').length}</div>
    <div class="card" onclick="filtro('Andamento')">Andamento: ${data.filter(x=>x.status=='Andamento').length}</div>
  `;

  render();
}

// FILTRO
function filtro(s) {
  statusAtual = s;
  render();
}

// RENDER
function render() {
  let listaFiltrada = dados.filter(x=>x.status==statusAtual);

  if (!listaFiltrada.length) {
    lista.innerHTML = "Nenhum chamado";
    return;
  }

  let html = "";

  listaFiltrada.forEach(c => {
    html += `
      <div class="chamado">
        <b>#${c.numero}</b><br>
        ${c.descricao}<br>
        ${c.unidade} | ${c.setor} | ${c.nome}

        <select onchange="mudar('${c.id}',this.value)">
          <option ${c.status=="Aberto"?"selected":""}>Aberto</option>
          <option ${c.status=="Andamento"?"selected":""}>Andamento</option>
          <option>Finalizado</option>
        </select>

        <div id="f_${c.id}" class="final">
          <input id="nome_${c.id}" placeholder="Atendido por">
          <textarea id="sol_${c.id}" placeholder="Solução"></textarea>
          <button onclick="finalizar('${c.id}')">Salvar</button>
        </div>
      </div>
    `;
  });

  lista.innerHTML = html;
}

// STATUS
function mudar(id,status) {
  if (status=="Finalizado") {
    document.getElementById("f_"+id).style.display="block";
  } else {
    update(id,status);
  }
}

// FINALIZAR
async function finalizar(id){
  let nome = document.getElementById("nome_"+id).value;
  let sol = document.getElementById("sol_"+id).value;

  if(!nome || !sol) return alert("Preencha");

  await db.from("chamados").update({
    status:"Finalizado",
    atendido_por:nome,
    solucao:sol
  }).eq("id",id);

  load();
}

// UPDATE
async function update(id,status){
  await db.from("chamados").update({status}).eq("id",id);
  load();
}

// FINALIZADOS
function verFinalizados(){
  let html = "<h3>Finalizados</h3>";

  dados.filter(x=>x.status=="Finalizado").forEach(c=>{
    html+=`
      <div class="chamado" onclick="toggle('${c.id}')">
        #${c.numero} - ${c.descricao}
        <div id="d_${c.id}" class="final">
          ${c.atendido_por}<br>
          ${c.solucao}
        </div>
      </div>
    `;
  });

  lista.innerHTML = html;
}

// DETALHE
function toggle(id){
  let el = document.getElementById("d_"+id);
  el.style.display = el.style.display=="block"?"none":"block";
}

// BUSCAR
function buscar(){
  let n = busca.value;
  let c = dados.find(x=>x.numero==n);

  if(!c) return alert("Não encontrado");

  lista.innerHTML = `
    <div class="chamado">
      #${c.numero}<br>
      ${c.descricao}<br>
      ${c.status}<br>
      ${c.atendido_por || "-"}<br>
      ${c.solucao || "-"}
    </div>
  `;
}

load();
</script>

</body>
</html>
