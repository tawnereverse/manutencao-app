<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  background: #1e3a8a;
  margin: 0;
  text-align: center;
}

.container {
  max-width: 900px;
  margin: 20px auto;
  background: white;
  color: #1e3a8a;
  padding: 20px;
  border-radius: 10px;
}

.logo {
  width: 120px;
}

.card {
  background: #3b82f6;
  color: white;
  padding: 15px;
  margin: 10px;
  border-radius: 8px;
  cursor: pointer;
}

.chamado {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 12px;
  margin-top: 10px;
  text-align: left;
}

.linha {
  margin-bottom: 5px;
}

select, textarea, button {
  width: 100%;
  margin-top: 8px;
  padding: 8px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
}

.urgente {
  color: red;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

  <img src="logo.png" class="logo">
  <h2>Painel</h2>

  <div id="dashboard"></div>

  <select id="filtroUnidade" onchange="carregarChamados()" style="display:none;"></select>

  <div id="lista"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://kmxmyjvxncteacojmbaj.supabase.co",
  "sb_publishable_OuujR_q1W9R1q9-MJuHPIg_a89r7Y9J"
);

let statusAtual = "";

// DASHBOARD
async function carregarDashboard() {
  let { data } = await supabaseClient.from("chamados").select("*");

  let abertos = data.filter(c => c.status === "Aberto").length;
  let andamento = data.filter(c => c.status === "Andamento").length;

  document.getElementById("dashboard").innerHTML = `
    <div class="card" onclick="abrirChamados('Aberto')">Abertos: ${abertos}</div>
    <div class="card" onclick="abrirChamados('Andamento')">Andamento: ${andamento}</div>
  `;
}

// ABRIR
function abrirChamados(status) {
  statusAtual = status;

  document.getElementById("filtroUnidade").style.display = "block";

  carregarUnidades();
  carregarChamados();
}

// UNIDADES
async function carregarUnidades() {
  let { data } = await supabaseClient.from("chamados").select("unidade");

  let unidades = [...new Set(data.map(c => c.unidade))];

  let select = document.getElementById("filtroUnidade");

  select.innerHTML = `<option value="">Todas unidades</option>`;

  unidades.forEach(u => {
    select.innerHTML += `<option>${u}</option>`;
  });
}

// CHAMADOS
async function carregarChamados() {
  let unidade = document.getElementById("filtroUnidade").value;

  let query = supabaseClient
    .from("chamados")
    .select("*")
    .eq("status", statusAtual);

  if (unidade) query = query.eq("unidade", unidade);

  let { data } = await query;

  let html = "";

  data.forEach(c => {
    html += `
      <div class="chamado">

        <div class="linha"><b>Unidade:</b> ${c.unidade}</div>
        <div class="linha"><b>Setor:</b> ${c.setor}</div>
        <div class="linha"><b>Aberto por:</b> ${c.nome}</div>
        <div class="linha"><b>Problema:</b> ${c.descricao}</div>
        <div class="linha">
          <b>Prioridade:</b> 
          <span class="${c.prioridade=='Urgente'?'urgente':''}">
            ${c.prioridade}
          </span>
        </div>

        <select onchange="mudarStatus('${c.id}', this.value)">
          <option ${c.status=="Aberto"?"selected":""}>Aberto</option>
          <option ${c.status=="Andamento"?"selected":""}>Andamento</option>
          <option>Finalizado</option>
        </select>

        <div id="final_${c.id}" style="display:none;">
          <select id="nome_${c.id}">
            <option value="">Atendido por</option>
            <option>Maicon</option>
            <option>Marcelo</option>
            <option>Vinicius</option>
            <option>Daniel</option>
          </select>

          <textarea id="solucao_${c.id}" maxlength="200" placeholder="Escreva aqui a solução aplicada"></textarea>

          <button onclick="finalizar('${c.id}')">Finalizar Chamado</button>
        </div>

      </div>
    `;
  });

  document.getElementById("lista").innerHTML = html;
}

// STATUS
function mudarStatus(id, status) {
  if (status === "Finalizado") {
    document.getElementById("final_" + id).style.display = "block";
  } else {
    atualizar(id, status);
  }
}

// FINALIZAR
async function finalizar(id) {
  let nome = document.getElementById("nome_" + id).value;
  let solucao = document.getElementById("solucao_" + id).value;

  if (!nome || !solucao) {
    alert("Preencha tudo");
    return;
  }

  await supabaseClient.from("chamados").update({
    status: "Finalizado",
    atendido_por: nome,
    solucao
  }).eq("id", id);

  alert("Finalizado!");
  carregarChamados();
  carregarDashboard();
}

// UPDATE
async function atualizar(id, status) {
  await supabaseClient.from("chamados").update({ status }).eq("id", id);
  carregarChamados();
}

carregarDashboard();
</script>

</body>
</html>
