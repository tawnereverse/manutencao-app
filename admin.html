<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #1e3a8a; margin: 0; padding: 10px; }
  .container { max-width: 900px; margin: 20px auto; background: white; color: #1e3a8a; padding: 20px; border-radius: 12px; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

  .logout { 
    position: absolute; top: 15px; right: 15px; 
    background: #ef4444; color: white; border: none; 
    padding: 8px 15px; border-radius: 6px; cursor: pointer; 
    font-size: 13px; font-weight: bold; width: auto !important;
  }

  .logo { width: 140px; display: block; margin: 10px auto; }
  
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .card { background: linear-gradient(90deg, #3b82f6, #2563eb); color: white; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; font-weight: bold; transition: 0.2s; }
  .card:hover { opacity: 0.9; transform: translateY(-2px); }
  
  .unidade-tag { background: #f1f5f9; padding: 5px 10px; border-radius: 4px; font-size: 12px; margin: 2px; display: inline-block; border: 1px solid #cbd5e1; }

  .chamado { border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-top: 12px; background: #fff; }
  .finalBox { background: #f0f9ff; padding: 15px; margin-top: 10px; border-radius: 8px; border-left: 4px solid #3b82f6; }

  select, textarea, input, .btn-full { width: 100%; margin-top: 10px; padding: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
  .btn-full { background: #2563eb; color: white; border: none; font-weight: bold; cursor: pointer; }
  .btn-ver-finalizados { background: #64748b; margin-bottom: 20px; }

  .urgente { color: #dc2626; font-weight: bold; text-transform: uppercase; font-size: 12px; }
  h3 { border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; margin-top: 25px; }
</style>
</head>
<body>

<div class="container">
  <button class="logout" onclick="logout()">Sair</button>
  <img src="logo.png" class="logo">
  <h2 style="text-align:center; margin-bottom: 20px;">Painel Administrativo</h2>

  <div class="stats-grid" id="dashboard"></div>
  <div id="unidades-box" style="margin-bottom: 20px; text-align: center;"></div>

  <hr>

  <div style="display: flex; gap: 5px;">
    <input type="number" id="buscaId" placeholder="Buscar pelo nº (Ex: 1)">
    <button class="btn-full" style="width: 100px;" onclick="buscar()">Buscar</button>
  </div>

  <button class="btn-full btn-ver-finalizados" onclick="verFinalizados()">Ver Chamados Finalizados</button>

  <div id="lista">
    <p style="text-align:center;">Carregando chamados...</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
// Configuração do Supabase
const supabaseClient = supabase.createClient(
  "https://kmxmyjvxncteacojmbaj.supabase.co",
  "sb_publishable_OuujR_q1W9R1q9-MJuHPIg_a89r7Y9J"
);

let chamados = [];
let statusAtual = "Aberto";

function logout() { location.reload(); }

// Carregar chamados do banco
async function carregar() {
  let { data, error } = await supabaseClient
    .from("chamados")
    .select("*")
    .order("created_at", { ascending: true }); // Ascendente para o primeiro ser o #1

  if (error) {
    console.error("Erro ao carregar:", error);
    return;
  }
  
  chamados = data;
  atualizarDashboard();
  render();
}

function atualizarDashboard() {
  let abertos = chamados.filter(c => c.status === "Aberto").length;
  let andamento = chamados.filter(c => c.status === "Andamento").length;

  document.getElementById('dashboard').innerHTML = `
    <div class="card" onclick="setFilter('Aberto')">Abertos: ${abertos}</div>
    <div class="card" onclick="setFilter('Andamento')">Em andamento: ${andamento}</div>
  `;

  let unidades = {};
  chamados.filter(c => c.status !== "Finalizado").forEach(c => {
    unidades[c.unidade] = (unidades[c.unidade] || 0) + 1;
  });

  let uniHtml = "<strong>Chamados por Unidade:</strong><br>";
  for (let u in unidades) {
    uniHtml += `<span class="unidade-tag">${u}: ${unidades[u]}</span>`;
  }
  document.getElementById('unidades-box').innerHTML = uniHtml;
}

function setFilter(status) {
  statusAtual = status;
  render();
}

// Renderizar a lista na tela
function render() {
  const listaDiv = document.getElementById('lista');
  
  // Filtramos os chamados pelo status
  let listaFiltrada = chamados.filter(c => c.status === statusAtual);

  if (!listaFiltrada.length) {
    listaDiv.innerHTML = `<p style='text-align:center;'>Nenhum chamado "${statusAtual}" encontrado.</p>`;
    return;
  }

  let html = `<h3>Chamados ${statusAtual}s</h3>`;
  
  listaFiltrada.forEach((c) => {
    // O número visual é a posição dele no array geral de chamados + 1
    let numVisual = chamados.indexOf(c) + 1;

    html += `
      <div class="chamado">
        <div style="display:flex; justify-content:space-between;">
           <b>#${numVisual}</b> 
           <span class="${c.prioridade=='Urgente'?'urgente':''}">${c.prioridade}</span>
        </div>
        <p>
          <b>Unidade:</b> ${c.unidade} | <b>Setor:</b> ${c.setor}<br>
          <b>Solicitante:</b> ${c.nome}<br>
          <b>Problema:</b> ${c.descricao}
        </p>

        <select onchange="mudarStatus('${c.id}', this.value)">
          <option value="Aberto" ${c.status=="Aberto"?"selected":""}>Aberto</option>
          <option value="Andamento" ${c.status=="Andamento"?"selected":""}>Andamento</option>
          <option value="Finalizado">Finalizar este chamado</option>
        </select>

        <div id="form_final_${c.id}" class="finalBox" style="display:none;">
          <b>Dados de Finalização:</b>
          <select id="atendente_${c.id}">
            <option value="">Quem atendeu?</option>
            <option>Maicon</option><option>Marcelo</option><option>Vinicius</option><option>Daniel</option>
          </select>
          <textarea id="solucao_${c.id}" placeholder="Descreva o que foi feito para resolver..."></textarea>
          <button class="btn-full" onclick="confirmarFinalizacao('${c.id}')">Confirmar e Salvar</button>
        </div>
      </div>
    `;
  });
  listaDiv.innerHTML = html;
}

// Quando muda o select de status
async function mudarStatus(idDoBanco, novoStatus) {
  if (novoStatus === "Finalizado") {
    // Mostra o formulário de finalização específico daquele ID
    document.getElementById("form_final_" + idDoBanco).style.display = "block";
  } else {
    const { error } = await supabaseClient
      .from("chamados")
      .update({ status: novoStatus })
      .eq("id", idDoBanco);
    
    if (error) alert("Erro ao atualizar status");
    carregar();
  }
}

// Salva no banco e some da lista
async function confirmarFinalizacao(idDoBanco) {
  let atendente = document.getElementById("atendente_" + idDoBanco).value;
  let solucao = document.getElementById("solucao_" + idDoBanco).value;

  if (!atendente || !solucao) {
    alert("Preencha o atendente e a solução antes de finalizar!");
    return;
  }

  const { error } = await supabaseClient
    .from("chamados")
    .update({
      status: "Finalizado",
      atendido_por: atendente,
      solucao: solucao
    })
    .eq("id", idDoBanco);

  if (error) {
    console.error(error);
    alert("Erro ao finalizar no banco de dados.");
  } else {
    alert("Chamado finalizado com sucesso!");
    await carregar(); // Isso limpa a tela e atualiza os números
  }
}

function verFinalizados() {
  statusAtual = "Finalizado";
  let listaFinal = chamados.filter(c => c.status === "Finalizado");

  let html = "<h3>Histórico de Finalizados</h3>";
  
  if (!listaFinal.length) {
    html += "<p>Nenhum chamado finalizado ainda.</p>";
  } else {
    listaFinal.forEach((c) => {
      let numVisual = chamados.indexOf(c) + 1;
      html += `
        <div class="chamado" onclick="toggleDet('${c.id}')" style="border-left: 5px solid #10b981; cursor:pointer;">
          <b>#${numVisual}</b> - ${c.unidade} - ${c.descricao.substring(0,40)}...
          <div id="det_${c.id}" class="finalBox" style="display:none;">
            <p><b>Aberto por:</b> ${c.nome} (${c.setor})</p>
            <hr>
            <p><b>✅ Atendido por:</b> ${c.atendido_por}</p>
            <p><b>🛠 Solução:</b> ${c.solucao}</p>
          </div>
        </div>
      `;
    });
  }
  document.getElementById('lista').innerHTML = html;
}

function toggleDet(id) {
  let el = document.getElementById("det_" + id);
  el.style.display = el.style.display === "block" ? "none" : "block";
}

function buscar() {
  let inputBusca = document.getElementById("buscaId").value;
  if (!inputBusca) return;
  
  // O usuário digita "1", nós pegamos o índice [0]
  let index = parseInt(inputBusca) - 1;
  let c = chamados[index];

  if (!c) {
    alert("Chamado #" + inputBusca + " não encontrado.");
    return;
  }

  document.getElementById('lista').innerHTML = `
    <button class="btn-full" onclick="carregar()" style="background:#64748b; margin-bottom:10px;">⬅ Voltar para a lista</button>
    <div class="chamado">
      <div style="display:flex; justify-content:space-between;">
           <b>#${inputBusca}</b> 
           <span>Status: <b>${c.status}</b></span>
      </div>
      <p>
        <b>Unidade:</b> ${c.unidade}<br>
        <b>Solicitante:</b> ${c.nome}<br>
        <b>Problema:</b> ${c.descricao}
      </p>
      ${c.status === 'Finalizado' ? `
        <div class="finalBox">
          <b>Atendido por:</b> ${c.atendido_por}<br>
          <b>Solução:</b> ${c.solucao}
        </div>
      ` : `<p><i>Este chamado ainda está em aberto/andamento.</i></p>`}
    </div>
  `;
}

// Inicia o sistema
carregar();
</script>

</body>
</html>
