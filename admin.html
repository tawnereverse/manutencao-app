<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; background: #1e3a8a; margin: 0; }

.container {
  max-width: 950px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 16px;
  position: relative;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.logout {
  position: absolute;
  top: 15px;
  right: 15px;
  background: #ef4444;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
}

.logo { width: 120px; display: block; margin: auto; }

.bemvindo {
  text-align: center;
  font-weight: bold;
  margin-top: 10px;
}

.card {
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: white;
  padding: 14px;
  margin-top: 12px;
  text-align: center;
  border-radius: 10px;
  cursor: pointer;
}

.chamado {
  border: 1px solid #ddd;
  padding: 15px;
  margin-top: 12px;
  border-radius: 10px;
  background: #fafafa;
}

.final {
  background: #eef6ff;
  padding: 12px;
  margin-top: 10px;
  display: none;
}

input, textarea {
  width: 100%;
  margin-top: 5px;
  padding: 8px;
}

textarea { height: 100px; }

.top-bar { display:flex; gap:10px; margin-bottom:15px; }
.top-bar input { flex:1; }
</style>
</head>

<body>

<div class="container">

<button class="logout" onclick="logout()">Sair</button>

<img src="logo.png" class="logo">
<div class="bemvindo">Bem-vindo, <span id="userLogado"></span></div>

<h2 style="text-align:center;">Painel</h2>

<div class="top-bar">
  <input id="busca" placeholder="Buscar nº">
  <button onclick="buscar()">Buscar</button>
</div>

<div id="dashboard"></div>

<button onclick="verFinalizados()">Finalizados</button>

<div id="lista"></div>

<hr>

<div id="areaAdmin">
  <h3>Criar usuário</h3>
  <input id="novo_user" placeholder="Usuário">
  <input id="novo_pass" placeholder="Senha">
  <button onclick="criarUsuario()">Criar</button>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

if(localStorage.getItem("logado") !== "sim"){
  location.href = "login.html";
}

const db = supabase.createClient(
  "https://kmxmyjvxncteacojmbaj.supabase.co",
  "sb_publishable_OuujR_q1W9R1q9-MJuHPIg_a89r7Y9J"
);

let usuarioLogado = localStorage.getItem("usuario");
document.getElementById("userLogado").innerText = usuarioLogado;

if(usuarioLogado !== "admin"){
  document.getElementById("areaAdmin").style.display = "none";
}

let dados = [];
let statusAtual = "Aberto";

function logout(){
  localStorage.clear();
  location.href = "login.html";
}

async function load(){
  let { data } = await db.from("chamados").select("*").order("numero");
  dados = data;

  dashboard.innerHTML = `
    <div class="card" onclick="filtro('Aberto')">Abertos: ${data.filter(x=>x.status=='Aberto').length}</div>
    <div class="card" onclick="filtro('Andamento')">Andamento: ${data.filter(x=>x.status=='Andamento').length}</div>
  `;

  render();
}

function filtro(s){ statusAtual = s; render(); }

function render(){
  let listaFiltrada = dados.filter(x=>x.status==statusAtual);

  let html = "";

  listaFiltrada.forEach(c=>{
    html+=`
      <div class="chamado">
        <b>#${c.numero}</b><br>
        ${c.descricao}<br>
        <small>${c.unidade} | ${c.setor} | ${c.nome}</small>

        ${c.atendido_por ? `<br><small><b>Em atendimento por:</b> ${c.atendido_por}</small>` : ""}

        <br><br>

        <select onchange="mudar('${c.id}',this.value)">
          <option ${c.status=="Aberto"?"selected":""}>Aberto</option>
          <option ${c.status=="Andamento"?"selected":""}>Andamento</option>
          <option>Finalizado</option>
        </select>

        <div id="f_${c.id}" class="final">
          <textarea id="sol_${c.id}" placeholder="Solução"></textarea>
          <button onclick="finalizar('${c.id}')">Salvar</button>
        </div>
      </div>
    `;
  });

  lista.innerHTML = html || "Nenhum chamado";
}

function mudar(id,status){
  if(status=="Finalizado"){
    document.getElementById("f_"+id).style.display="block";
  } else {
    update(id,status);
  }
}

async function update(id,status){
  let dadosUpdate = { status };

  if(status === "Andamento"){
    dadosUpdate.atendido_por = usuarioLogado;
    dadosUpdate.iniciado_por = usuarioLogado;
    dadosUpdate.data_inicio = new Date();
  }

  await db.from("chamados").update(dadosUpdate).eq("id",id);
  load();
}

async function finalizar(id){
  let sol = document.getElementById("sol_"+id).value;

  if(!sol) return alert("Preencha");

  await db.from("chamados").update({
    status:"Finalizado",
    finalizado_por: usuarioLogado,
    data_fim: new Date(),
    solucao: sol
  }).eq("id",id);

  load();
}

function verFinalizados(){
  let html = "<h3>Finalizados</h3>";

  dados.filter(x=>x.status=="Finalizado").forEach(c=>{
    html+=`
      <div class="chamado">
        <b>#${c.numero}</b><br>
        ${c.descricao}<br>

        <small>${c.unidade} | ${c.setor} | ${c.nome}</small><br><br>

        <b>Iniciado por:</b> ${c.iniciado_por}<br>
        <b>Finalizado por:</b> ${c.finalizado_por}<br>
        <b>Início:</b> ${new Date(c.data_inicio).toLocaleString()}<br>
        <b>Fim:</b> ${new Date(c.data_fim).toLocaleString()}<br><br>

        <b>Solução:</b><br>${c.solucao}
      </div>
    `;
  });

  lista.innerHTML = html;
}

function buscar(){
  let c = dados.find(x=>x.numero==busca.value);

  if(!c) return alert("Não encontrado");

  lista.innerHTML = `
    <div class="chamado">
      <b>#${c.numero}</b><br>
      ${c.descricao}<br>
      ${c.status}
    </div>
  `;
}

async function criarUsuario(){
  let user = novo_user.value;
  let pass = novo_pass.value;

  if(!user || !pass) return alert("Preencha");

  await db.from("usuarios").insert([{ login:user, senha:pass }]);

  alert("Criado");
}

load();

</script>

</body>
</html>
