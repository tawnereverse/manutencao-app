<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  background: #1e3a8a;
  margin: 0;
}

.container {
  max-width: 900px;
  margin: 20px auto;
  background: white;
  color: #1e3a8a;
  padding: 20px;
  border-radius: 12px;
  position: relative;
}

/* BOTÃO SAIR CORRETO */
.logout {
  position: absolute;
  top: 10px;
  right: 10px;
  background: #2563eb;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
}

.logo {
  width: 120px;
  display: block;
  margin: auto;
}

/* BOTÕES */
.card {
  background: linear-gradient(90deg, #3b82f6, #2563eb);
  color: white;
  padding: 14px;
  margin-top: 10px;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  font-weight: bold;
}

/* CHAMADO */
.chamado {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 12px;
  margin-top: 12px;
  cursor: pointer;
}

.finalBox {
  background: #eef6ff;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  display: none;
}

select, textarea, input, button {
  width: 100%;
  margin-top: 8px;
  padding: 8px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
}

.urgente {
  color: red;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<button class="logout" onclick="logout()">Sair</button>

<img src="logo.png" class="logo">
<h2 style="text-align:center;">Painel</h2>

<input type="number" id="buscaId" placeholder="Buscar chamado pelo número">
<button onclick="buscar()">Buscar</button>

<div id="dashboard"></div>

<button onclick="verFinalizados()">Ver Finalizados</button>

<div id="lista"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://kmxmyjvxncteacojmbaj.supabase.co",
  "sb_publishable_OuujR_q1W9R1q9-MJuHPIg_a89r7Y9J"
);

let chamados = [];
let statusAtual = "Aberto";

// LOGOUT
function logout() {
  location.reload();
}

// CARREGAR
async function carregar() {
  let { data } = await supabaseClient
    .from("chamados")
    .select("*")
    .order("created_at");

  chamados = data;

  let abertos = data.filter(c => c.status === "Aberto").length;
  let andamento = data.filter(c => c.status === "Andamento").length;

  dashboard.innerHTML = `
    <div class="card" onclick="abrir('Aberto')">Abertos: ${abertos}</div>
    <div class="card" onclick="abrir('Andamento')">Em andamento: ${andamento}</div>
  `;

  render();
}

// FILTRO
function abrir(status) {
  statusAtual = status;
  render();
}

// RENDER
function render() {

  let listaFiltrada = chamados.filter(c => c.status === statusAtual);

  if (!listaFiltrada.length) {
    lista.innerHTML = "<p style='text-align:center;'>Nenhum chamado</p>";
    return;
  }

  let html = "";

  listaFiltrada.forEach((c) => {

    let numero = chamados.indexOf(c) + 1;

    html += `
      <div class="chamado">
        <b>#${numero}</b><br><br>

        <b>Unidade:</b> ${c.unidade}<br>
        <b>Setor:</b> ${c.setor}<br>
        <b>Aberto por:</b> ${c.nome}<br>
        <b>Problema:</b> ${c.descricao}<br>
        <b>Tipo:</b> <span class="${c.prioridade=='Urgente'?'urgente':''}">
          ${c.prioridade}
        </span>

        <select onchange="mudar('${c.id}', this.value)">
          <option ${c.status=="Aberto"?"selected":""}>Aberto</option>
          <option ${c.status=="Andamento"?"selected":""}>Andamento</option>
          <option>Finalizado</option>
        </select>

        <div id="final_${c.id}" style="display:none;">
          <select id="nome_${c.id}">
            <option value="">Atendido por</option>
            <option>Maicon</option>
            <option>Marcelo</option>
            <option>Vinicius</option>
            <option>Daniel</option>
          </select>

          <textarea id="solucao_${c.id}" placeholder="Escreva aqui a solução aplicada"></textarea>

          <button onclick="finalizar('${c.id}')">Confirmar Finalização</button>
        </div>
      </div>
    `;
  });

  lista.innerHTML = html;
}

// ALTERAR STATUS
function mudar(id, status) {
  if (status === "Finalizado") {
    document.getElementById("final_" + id).style.display = "block";
  } else {
    atualizar(id, status);
  }
}

// FINALIZAR CORRETO
async function finalizar(id) {

  let nome = document.getElementById("nome_" + id).value;
  let solucao = document.getElementById("solucao_" + id).value;

  if (!nome || !solucao) {
    alert("Preencha tudo");
    return;
  }

  await supabaseClient.from("chamados").update({
    status: "Finalizado",
    atendido_por: nome,
    solucao
  }).eq("id", id);

  alert("Finalizado com sucesso");

  await carregar(); // 🔥 IMPORTANTE
}

// UPDATE
async function atualizar(id, status) {
  await supabaseClient.from("chamados").update({ status }).eq("id", id);
  carregar();
}

// FINALIZADOS (CLICÁVEL)
function verFinalizados() {

  let listaFinal = chamados.filter(c => c.status === "Finalizado");

  if (!listaFinal.length) {
    lista.innerHTML = "<p>Nenhum finalizado</p>";
    return;
  }

  let html = "<h3>Finalizados</h3>";

  listaFinal.forEach((c) => {

    let numero = chamados.indexOf(c) + 1;

    html += `
      <div class="chamado" onclick="toggle('${c.id}')">
        <b>#${numero}</b> - ${c.descricao}

        <div id="det_${c.id}" class="finalBox">
          <b>Unidade:</b> ${c.unidade}<br>
          <b>Setor:</b> ${c.setor}<br>
          <b>Aberto por:</b> ${c.nome}<br><br>

          <b>Atendido por:</b> ${c.atendido_por || "-"}<br>
          <b>Solução:</b> ${c.solucao || "-"}
        </div>
      </div>
    `;
  });

  lista.innerHTML = html;
}

// ABRIR DETALHE
function toggle(id) {
  let el = document.getElementById("det_" + id);
  el.style.display = el.style.display === "block" ? "none" : "block";
}

// BUSCAR
function buscar() {
  let n = document.getElementById("buscaId").value;

  if (!n) return;

  let c = chamados[n - 1];

  if (!c) {
    alert("Não encontrado");
    return;
  }

  lista.innerHTML = `
    <div class="chamado">
      <b>#${n}</b><br><br>

      <b>Unidade:</b> ${c.unidade}<br>
      <b>Setor:</b> ${c.setor}<br>
      <b>Aberto por:</b> ${c.nome}<br>
      <b>Problema:</b> ${c.descricao}<br><br>

      <b>Status:</b> ${c.status}<br><br>

      <b>Atendido por:</b> ${c.atendido_por || "-"}<br>
      <b>Solução:</b> ${c.solucao || "-"}
    </div>
  `;
}

// START
carregar();
</script>

</body>
</html>
