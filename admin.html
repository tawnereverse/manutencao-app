<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Manutenção</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #1e3a8a;
}

.container {
  max-width: 900px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 10px;
}

.logo {
  display: block;
  margin: auto;
  width: 120px;
}

.card {
  background: #3b82f6;
  color: white;
  padding: 15px;
  margin: 10px 0;
  border-radius: 8px;
  text-align: center;
  font-size: 18px;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border: none;
  background: #2563eb;
  color: white;
  border-radius: 8px;
}

select, textarea {
  width: 100%;
  margin-top: 5px;
  padding: 8px;
}

.chamado {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 10px;
  margin-top: 10px;
}

@media (max-width: 600px) {
  .container {
    margin: 10px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="container" id="loginBox">
  <img src="logo.png" class="logo">
  <h2>Login</h2>
  <input id="login" placeholder="Usuário"><br><br>
  <input id="senha" type="password" placeholder="Senha"><br><br>
  <button onclick="entrar()">Entrar</button>
</div>

<!-- PAINEL -->
<div class="container" id="painel" style="display:none;">
  <img src="logo.png" class="logo">
  <h2>Painel de Chamados</h2>

  <div id="dashboard"></div>

  <button onclick="abrirUnidades()">Ver chamados por unidade</button>

  <div id="unidades" style="display:none;">
    <select id="selectUnidade" onchange="carregarChamados()"></select>
    <div id="lista"></div>
  </div>

  <button onclick="logout()">Sair</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://kmxmyjvxncteacojmbaj.supabase.co",
  "sb_publishable_OuujR_q1W9R1q9-MJuHPIg_a89r7Y9J"
);

// LOGIN
async function entrar() {
  let login = document.getElementById("login").value;
  let senha = document.getElementById("senha").value;

  let { data } = await supabaseClient
    .from("usuarios")
    .select("*")
    .eq("login", login)
    .eq("senha", senha);

  if (!data.length) return alert("Login inválido");

  localStorage.setItem("logado", "sim");

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("painel").style.display = "block";

  carregarDashboard();
}

// DASHBOARD
async function carregarDashboard() {
  let { data } = await supabaseClient.from("chamados").select("*");

  let abertos = data.filter(c => c.status === "Aberto").length;
  let andamento = data.filter(c => c.status === "Andamento").length;

  document.getElementById("dashboard").innerHTML = `
    <div class="card">Abertos: ${abertos}</div>
    <div class="card">Em andamento: ${andamento}</div>
  `;
}

// ABRIR UNIDADES
async function abrirUnidades() {
  document.getElementById("unidades").style.display = "block";

  let { data } = await supabaseClient.from("chamados").select("unidade");

  let unidades = [...new Set(data.map(c => c.unidade))];

  let select = document.getElementById("selectUnidade");

  select.innerHTML = "<option value=''>Selecione a unidade</option>";

  unidades.forEach(u => {
    select.innerHTML += `<option>${u}</option>`;
  });
}

// CARREGAR CHAMADOS
async function carregarChamados() {
  let unidade = document.getElementById("selectUnidade").value;

  let { data } = await supabaseClient
    .from("chamados")
    .select("*")
    .eq("unidade", unidade)
    .order("created_at", { ascending: false });

  let html = "";

  data.forEach(c => {
    html += `
      <div class="chamado">
        <b>Setor:</b> ${c.setor}<br>
        <b>Problema:</b> ${c.descricao}<br>
        <b>Prioridade:</b> ${c.prioridade}<br>
        <b>Status:</b> ${c.status}<br><br>

        <label>Atendido por:</label>
        <select id="nome_${c.id}">
          <option value="">Selecione</option>
          <option>Maicon</option>
          <option>Marcelo</option>
          <option>Vinicius</option>
          <option>Daniel</option>
        </select>

        <label>Solução:</label>
        <textarea maxlength="200" id="solucao_${c.id}" placeholder="Descreva a solução"></textarea>

        <select onchange="mudarStatus('${c.id}', this.value)">
          <option ${c.status=="Aberto"?"selected":""}>Aberto</option>
          <option ${c.status=="Andamento"?"selected":""}>Andamento</option>
          <option ${c.status=="Finalizado"?"selected":""}>Finalizado</option>
        </select>
      </div>
    `;
  });

  document.getElementById("lista").innerHTML = html;
}

// MUDAR STATUS
async function mudarStatus(id, status) {
  let atendido = document.getElementById("nome_" + id).value;
  let solucao = document.getElementById("solucao_" + id).value;

  if (status === "Finalizado") {
    if (!atendido || !solucao) {
      alert("Preencha 'Atendido por' e 'Solução'");
      return;
    }
  }

  await supabaseClient
    .from("chamados")
    .update({
      status,
      atendido_por: atendido,
      solucao
    })
    .eq("id", id);

  alert("Atualizado!");
  carregarDashboard();
}

// LOGOUT
function logout() {
  localStorage.clear();
  location.reload();
}

// AUTO LOGIN
if (localStorage.getItem("logado")) {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("painel").style.display = "block";
  carregarDashboard();
}
</script>

</body>
</html>
