<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  background: #1e3a8a;
  margin: 0;
}

/* CONTAINER */
.container {
  max-width: 900px;
  margin: 20px auto;
  background: white;
  color: #1e3a8a;
  padding: 20px;
  border-radius: 12px;
  position: relative;
}

/* LOGO */
.logo {
  width: 120px;
  display: block;
  margin: auto;
}

/* BOTÃO SAIR */
.logout {
  position: absolute;
  top: 15px;
  right: 15px;
  background: #2563eb;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
}

/* DASHBOARD */
.card {
  background: linear-gradient(90deg, #3b82f6, #2563eb);
  color: white;
  padding: 14px;
  margin-top: 10px;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  font-weight: bold;
}

/* CHAMADO */
.chamado {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 14px;
  margin-top: 15px;
}

/* LINHAS */
.linha {
  margin-bottom: 6px;
}

/* URGENTE */
.urgente {
  color: red;
  font-weight: bold;
}

/* CAMPOS */
select, textarea, input, button {
  width: 100%;
  margin-top: 8px;
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  background: #2563eb;
  color: white;
  border: none;
}

/* FINALIZADO BOX */
.finalizado {
  background: #f0f9ff;
  border-left: 4px solid #2563eb;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
}
</style>

</head>

<body>

<div class="container">

  <button class="logout" onclick="logout()">Sair</button>

  <img src="logo.png" class="logo">

  <h2 style="text-align:center;">Painel</h2>

  <div id="dashboard"></div>

  <select id="filtroUnidade" onchange="carregarChamados()" style="display:none;"></select>

  <button onclick="verFinalizados()">Ver Finalizados</button>

  <div id="lista"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://kmxmyjvxncteacojmbaj.supabase.co",
  "sb_publishable_OuujR_q1W9R1q9-MJuHPIg_a89r7Y9J"
);

let statusAtual = "";

// LOGOUT
function logout() {
  location.reload();
}

// DASHBOARD
async function carregarDashboard() {
  let { data } = await supabaseClient.from("chamados").select("*");

  let abertos = data.filter(c => c.status === "Aberto").length;
  let andamento = data.filter(c => c.status === "Andamento").length;

  dashboard.innerHTML = `
    <div class="card" onclick="abrirChamados('Aberto')">Abertos: ${abertos}</div>
    <div class="card" onclick="abrirChamados('Andamento')">Em andamento: ${andamento}</div>
  `;
}

// ABRIR
function abrirChamados(status) {
  statusAtual = status;
  filtroUnidade.style.display = "block";
  carregarUnidades();
  carregarChamados();
}

// FINALIZADOS
function verFinalizados() {
  statusAtual = "Finalizado";
  filtroUnidade.style.display = "block";
  carregarUnidades();
  carregarChamados();
}

// UNIDADES
async function carregarUnidades() {
  let { data } = await supabaseClient.from("chamados").select("unidade");

  let unidades = [...new Set(data.map(c => c.unidade))];

  filtroUnidade.innerHTML = "<option value=''>Todas unidades</option>";

  unidades.forEach(u => {
    filtroUnidade.innerHTML += `<option>${u}</option>`;
  });
}

// LISTA
async function carregarChamados() {
  let unidade = filtroUnidade.value;

  let query = supabaseClient
    .from("chamados")
    .select("*")
    .eq("status", statusAtual);

  if (unidade) query = query.eq("unidade", unidade);

  let { data } = await query;

  let html = "";

  data.forEach(c => {

    html += `<div class="chamado">`;

    html += `
      <div class="linha"><b>Unidade:</b> ${c.unidade}</div>
      <div class="linha"><b>Setor:</b> ${c.setor}</div>
      <div class="linha"><b>Aberto por:</b> ${c.nome}</div>
      <div class="linha"><b>Problema:</b> ${c.descricao}</div>
      <div class="linha">
        <b>Prioridade:</b> 
        <span class="${c.prioridade=='Urgente'?'urgente':''}">
          ${c.prioridade}
        </span>
      </div>
    `;

    // FINALIZADOS BONITO
    if (statusAtual === "Finalizado") {
      html += `
        <div class="finalizado">
          <b>Atendido por:</b> ${c.atendido_por || "-"}<br>
          <b>Solução:</b> ${c.solucao || "-"}
        </div>
      `;
    }

    // EM ABERTO / ANDAMENTO
    if (statusAtual !== "Finalizado") {
      html += `
        <select onchange="mudarStatus('${c.id}', this.value)">
          <option ${c.status=="Aberto"?"selected":""}>Aberto</option>
          <option ${c.status=="Andamento"?"selected":""}>Andamento</option>
          <option>Finalizado</option>
        </select>

        <div id="final_${c.id}" style="display:none;">
          <select id="nome_${c.id}">
            <option value="">Atendido por</option>
            <option>Maicon</option>
            <option>Marcelo</option>
            <option>Vinicius</option>
            <option>Daniel</option>
          </select>

          <textarea id="solucao_${c.id}" placeholder="Escreva aqui a solução aplicada" maxlength="200"></textarea>

          <button onclick="finalizar('${c.id}')">Finalizar Chamado</button>
        </div>
      `;
    }

    html += `</div>`;
  });

  lista.innerHTML = html;
}

// STATUS
function mudarStatus(id, status) {
  if (status === "Finalizado") {
    document.getElementById("final_" + id).style.display = "block";
  } else {
    atualizar(id, status);
  }
}

// FINALIZAR
async function finalizar(id) {
  let nome = document.getElementById("nome_" + id).value;
  let solucao = document.getElementById("solucao_" + id).value;

  if (!nome || !solucao) {
    alert("Preencha tudo");
    return;
  }

  await supabaseClient.from("chamados").update({
    status: "Finalizado",
    atendido_por: nome,
    solucao
  }).eq("id", id);

  alert("Chamado finalizado!");

  carregarChamados();
  carregarDashboard();
}

// UPDATE
async function atualizar(id, status) {
  await supabaseClient.from("chamados").update({ status }).eq("id", id);
  carregarChamados();
}

carregarDashboard();
</script>

</body>
</html>
