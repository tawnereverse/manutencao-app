<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Admin</title>

<link rel="stylesheet" href="style.css">

<style>

/* CONTAINER CENTRAL */
.container {
  max-width: 900px;
  margin: auto;
}

/* DASHBOARD */
.dashboard {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}

/* CARDS */
.card {
  display: inline-block;
  background: #3b82f6;
  color: white;
  padding: 10px;
  margin: 5px;
  border-radius: 8px;
}

/* TABELA RESPONSIVA */
.table-container {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  margin-top: 15px;
  min-width: 700px;
}

th, td {
  padding: 8px;
  border: 1px solid #ddd;
  text-align: left;
}

th {
  background: #1e3a8a;
  color: white;
}

/* PROBLEMA MAIOR */
td:nth-child(3) {
  max-width: 250px;
  word-wrap: break-word;
}

/* STATUS */
.status-Aberto { color: red; font-weight: bold; }
.status-Andamento { color: orange; font-weight: bold; }
.status-Finalizado { color: green; font-weight: bold; }

select, button {
  margin-top: 5px;
}

</style>
</head>

<body>

<div class="container" id="loginBox">
  <img src="logo.png" class="logo">
  <h2>Login</h2>
  <input id="login" placeholder="Usuário">
  <input id="senha" type="password" placeholder="Senha">
  <button onclick="entrar()">Entrar</button>
</div>

<div class="container" id="adminBox" style="display:none;">

  <img src="logo.png" class="logo">
  <h2>Painel de Chamados</h2>

  <button onclick="logout()">Sair</button>

  <!-- DASHBOARD LIMPO -->
  <div class="dashboard" id="dashboard"></div>

  <!-- FILTROS -->
  <select id="filtroUnidade" onchange="carregar()">
    <option value="">Todas Unidades</option>
  </select>

  <select id="filtroStatus" onchange="carregar()">
    <option value="">Todos Status</option>
    <option>Aberto</option>
    <option>Andamento</option>
    <option>Finalizado</option>
  </select>

  <select id="filtroPrioridade" onchange="carregar()">
    <option value="">Todas Prioridades</option>
    <option>Baixa</option>
    <option>Média</option>
    <option>Alta</option>
  </select>

  <!-- TABELA -->
  <div class="table-container">
    <table id="tabela"></table>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://kmxmyjvxncteacojmbaj.supabase.co",
  "sb_publishable_OuujR_q1W9R1q9-MJuHPIg_a89r7Y9J"
);

// LOGIN
async function entrar() {
  let login = document.getElementById("login").value.trim();
  let senha = document.getElementById("senha").value.trim();

  let { data } = await supabaseClient
    .from("usuarios")
    .select("*")
    .eq("login", login)
    .eq("senha", senha);

  if (!data.length) return alert("Login inválido");

  localStorage.setItem("logado", "sim");
  localStorage.setItem("tipo", data[0].tipo);

  iniciarPainel();
}

function logout() {
  localStorage.clear();
  location.reload();
}

// DASHBOARD LIMPO
function montarDashboard(data) {
  let total = data.length;

  let aberto = data.filter(c => c.status === "Aberto").length;
  let andamento = data.filter(c => c.status === "Andamento").length;
  let finalizado = data.filter(c => c.status === "Finalizado").length;

  document.getElementById("dashboard").innerHTML = `
    <div class="card">Total: ${total}</div>
    <div class="card">Abertos: ${aberto}</div>
    <div class="card">Andamento: ${andamento}</div>
    <div class="card">Finalizados: ${finalizado}</div>
  `;
}

// CARREGAR DADOS
async function carregar() {
  let unidade = document.getElementById("filtroUnidade").value;
  let status = document.getElementById("filtroStatus").value;
  let prioridade = document.getElementById("filtroPrioridade").value;

  let query = supabaseClient
    .from("chamados")
    .select("*")
    .order("created_at", { ascending: false });

  if (unidade) query = query.eq("unidade", unidade);
  if (status) query = query.eq("status", status);
  if (prioridade) query = query.eq("prioridade", prioridade);

  let { data } = await query;

  montarDashboard(data);

  // preencher unidades automaticamente
  let unidades = [...new Set(data.map(c => c.unidade))];
  let select = document.getElementById("filtroUnidade");

  select.innerHTML = `<option value="">Todas Unidades</option>`;
  unidades.forEach(u => {
    select.innerHTML += `<option>${u}</option>`;
  });

  // tabela
  let html = `
    <tr>
      <th>Unidade</th>
      <th>Setor</th>
      <th>Problema</th>
      <th>Prioridade</th>
      <th>Foto</th>
      <th>Status</th>
      <th>Ação</th>
    </tr>
  `;

  data.forEach(c => {
    html += `
      <tr>
        <td>${c.unidade}</td>
        <td>${c.setor}</td>
        <td>${c.descricao}</td>
        <td>${c.prioridade}</td>
        <td>${c.foto_url ? `<img src="${c.foto_url}" width="60">` : "-"}</td>
        <td class="status-${c.status}">${c.status}</td>
        <td>
          <select onchange="atualizarStatus('${c.id}', this.value)">
            <option ${c.status=="Aberto"?"selected":""}>Aberto</option>
            <option ${c.status=="Andamento"?"selected":""}>Andamento</option>
            <option ${c.status=="Finalizado"?"selected":""}>Finalizado</option>
          </select>

          ${
            localStorage.getItem("tipo") === "admin"
              ? `<button onclick="deletar('${c.id}')">Excluir</button>`
              : ""
          }
        </td>
      </tr>
    `;
  });

  document.getElementById("tabela").innerHTML = html;
}

// STATUS
async function atualizarStatus(id, status) {
  await supabaseClient.from("chamados").update({ status }).eq("id", id);
  carregar();
}

// DELETE
async function deletar(id) {
  if (!confirm("Excluir chamado?")) return;
  await supabaseClient.from("chamados").delete().eq("id", id);
  carregar();
}

// INICIAR
function iniciarPainel() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("adminBox").style.display = "block";
  carregar();
}

if (localStorage.getItem("logado")) iniciarPainel();
</script>

</body>
</html>
