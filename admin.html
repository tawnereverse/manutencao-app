<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  background: #1e3a8a;
  margin: 0;
  text-align: center;
}

.container {
  max-width: 900px;
  margin: 20px auto;
  background: white;
  color: #1e3a8a;
  padding: 20px;
  border-radius: 10px;
  position: relative;
}

.logo {
  width: 120px;
}

.logout {
  position: absolute;
  top: 15px;
  right: 15px;
  background: #2563eb;
  color: white;
  padding: 8px 12px;
  border-radius: 6px;
  border: none;
}

.card {
  background: #3b82f6;
  color: white;
  padding: 15px;
  margin: 10px;
  border-radius: 8px;
  cursor: pointer;
}

.chamado {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 12px;
  margin-top: 10px;
  text-align: left;
}

select, textarea, input, button {
  width: 100%;
  margin-top: 8px;
  padding: 8px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
}

.urgente {
  color: red;
  font-weight: bold;
}

.admin-box {
  border: 1px dashed #ccc;
  padding: 10px;
  margin-top: 20px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="container" id="loginBox">
  <img src="logo.png" class="logo">
  <h2>Login</h2>

  <input id="login" placeholder="Usuário">
  <input id="senha" type="password" placeholder="Senha">

  <button onclick="entrar()">Entrar</button>
</div>

<!-- PAINEL -->
<div class="container" id="painel" style="display:none;">

  <button class="logout" onclick="logout()">Sair</button>

  <img src="logo.png" class="logo">
  <h2>Painel</h2>

  <div id="dashboard"></div>

  <select id="filtroUnidade" onchange="carregarChamados()" style="display:none;"></select>

  <button onclick="verFinalizados()">Ver Finalizados</button>

  <div id="lista"></div>

  <!-- ADMIN -->
  <div id="adminArea" class="admin-box" style="display:none;">
    <h3>Criar Usuário</h3>
    <input id="novoLogin" placeholder="Login">
    <input id="novaSenha" placeholder="Senha">
    <select id="tipoUser">
      <option value="user">Usuário</option>
      <option value="admin">Admin</option>
    </select>
    <button onclick="criarUsuario()">Criar</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://kmxmyjvxncteacojmbaj.supabase.co",
  "sb_publishable_OuujR_q1W9R1q9-MJuHPIg_a89r7Y9J"
);

let statusAtual = "";
let usuarioTipo = "";

// LOGIN
async function entrar() {
  let { data } = await supabaseClient
    .from("usuarios")
    .select("*")
    .eq("login", login.value)
    .eq("senha", senha.value);

  if (!data.length) return alert("Login inválido");

  usuarioTipo = data[0].tipo;

  loginBox.style.display = "none";
  painel.style.display = "block";

  if (usuarioTipo === "admin") {
    adminArea.style.display = "block";
  }

  carregarDashboard();
}

// LOGOUT
function logout() {
  location.reload();
}

// DASHBOARD
async function carregarDashboard() {
  let { data } = await supabaseClient.from("chamados").select("*");

  let abertos = data.filter(c => c.status === "Aberto").length;
  let andamento = data.filter(c => c.status === "Andamento").length;

  dashboard.innerHTML = `
    <div class="card" onclick="abrirChamados('Aberto')">Abertos: ${abertos}</div>
    <div class="card" onclick="abrirChamados('Andamento')">Andamento: ${andamento}</div>
  `;
}

// ABRIR
function abrirChamados(status) {
  statusAtual = status;
  filtroUnidade.style.display = "block";
  carregarUnidades();
  carregarChamados();
}

// FINALIZADOS
async function verFinalizados() {
  statusAtual = "Finalizado";
  filtroUnidade.style.display = "block";
  carregarUnidades();
  carregarChamados();
}

// UNIDADES
async function carregarUnidades() {
  let { data } = await supabaseClient.from("chamados").select("unidade");

  let unidades = [...new Set(data.map(c => c.unidade))];

  filtroUnidade.innerHTML = "<option value=''>Todas unidades</option>";

  unidades.forEach(u => {
    filtroUnidade.innerHTML += `<option>${u}</option>`;
  });
}

// LISTA
async function carregarChamados() {
  let unidade = filtroUnidade.value;

  let query = supabaseClient
    .from("chamados")
    .select("*")
    .eq("status", statusAtual);

  if (unidade) query = query.eq("unidade", unidade);

  let { data } = await query;

  let html = "";

  data.forEach(c => {
    html += `
      <div class="chamado">
        <b>Unidade:</b> ${c.unidade}<br>
        <b>Setor:</b> ${c.setor}<br>
        <b>Aberto por:</b> ${c.nome}<br>
        <b>Problema:</b> ${c.descricao}<br>
        <b class="${c.prioridade=='Urgente'?'urgente':''}">
          ${c.prioridade}
        </b><br><br>
    `;

    if (statusAtual !== "Finalizado") {
      html += `
        <select onchange="mudarStatus('${c.id}', this.value)">
          <option ${c.status=="Aberto"?"selected":""}>Aberto</option>
          <option ${c.status=="Andamento"?"selected":""}>Andamento</option>
          <option>Finalizado</option>
        </select>

        <div id="final_${c.id}" style="display:none;">
          <select id="nome_${c.id}">
            <option value="">Atendido por</option>
            <option>Maicon</option>
            <option>Marcelo</option>
            <option>Vinicius</option>
            <option>Daniel</option>
          </select>

          <textarea id="solucao_${c.id}" placeholder="Escreva aqui a solução aplicada" maxlength="200"></textarea>

          <button onclick="finalizar('${c.id}')">Finalizar</button>
        </div>
      `;
    }

    if (usuarioTipo === "admin") {
      html += `<button onclick="deletar('${c.id}')">Excluir</button>`;
    }

    html += `</div>`;
  });

  lista.innerHTML = html;
}

// STATUS
function mudarStatus(id, status) {
  if (status === "Finalizado") {
    document.getElementById("final_" + id).style.display = "block";
  } else {
    atualizar(id, status);
  }
}

// FINALIZAR
async function finalizar(id) {
  let nome = document.getElementById("nome_" + id).value;
  let solucao = document.getElementById("solucao_" + id).value;

  if (!nome || !solucao) return alert("Preencha tudo");

  await supabaseClient.from("chamados").update({
    status: "Finalizado",
    atendido_por: nome,
    solucao
  }).eq("id", id);

  alert("Finalizado!");

  carregarChamados();
  carregarDashboard();
}

// UPDATE
async function atualizar(id, status) {
  await supabaseClient.from("chamados").update({ status }).eq("id", id);
  carregarChamados();
}

// DELETE
async function deletar(id) {
  if (!confirm("Excluir chamado?")) return;

  await supabaseClient.from("chamados").delete().eq("id", id);

  carregarChamados();
}

// CRIAR USER
async function criarUsuario() {
  await supabaseClient.from("usuarios").insert([{
    login: novoLogin.value,
    senha: novaSenha.value,
    tipo: tipoUser.value
  }]);

  alert("Usuário criado!");
}
</script>

</body>
</html>
