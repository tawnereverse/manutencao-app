<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #1e3a8a; margin: 0; padding: 10px; }
  .container { max-width: 900px; margin: 20px auto; background: white; color: #1e3a8a; padding: 20px; border-radius: 12px; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

  .logout { 
    position: absolute; top: 15px; right: 15px; 
    background: #ef4444; color: white; border: none; 
    padding: 8px 15px; border-radius: 6px; cursor: pointer; 
    font-size: 13px; font-weight: bold; width: auto !important;
  }

  .logo { width: 140px; display: block; margin: 10px auto; }
  
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .card { background: linear-gradient(90deg, #3b82f6, #2563eb); color: white; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; font-weight: bold; transition: 0.2s; }
  .card:hover { opacity: 0.9; transform: translateY(-2px); }
  
  .unidade-tag { background: #f1f5f9; padding: 5px 10px; border-radius: 4px; font-size: 12px; margin: 2px; display: inline-block; border: 1px solid #cbd5e1; }

  .chamado { border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-top: 12px; background: #fff; }
  .finalBox { background: #f0f9ff; padding: 15px; margin-top: 10px; border-radius: 8px; border-left: 4px solid #3b82f6; }

  select, textarea, input, .btn-full { width: 100%; margin-top: 10px; padding: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
  .btn-full { background: #2563eb; color: white; border: none; font-weight: bold; cursor: pointer; }
  .btn-ver-finalizados { background: #64748b; margin-bottom: 20px; }

  .urgente { color: #dc2626; font-weight: bold; text-transform: uppercase; font-size: 12px; }
  h3 { border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; margin-top: 25px; }
</style>
</head>

<div class="container">
  <button class="logout" onclick="logout()">Sair</button>
  <img src="logo.png" class="logo">
  <h2 style="text-align:center; margin-bottom: 20px;">Painel Administrativo</h2>

  <div class="stats-grid" id="dashboard"></div>
  <div id="unidades-box" style="margin-bottom: 20px; text-align: center;"></div>

  <hr>

  <div style="display: flex; gap: 5px;">
    <input type="number" id="buscaId" placeholder="Buscar pelo nº (Ex: 1)">
    <button class="btn-full" style="width: 100px;" onclick="buscar()">Buscar</button>
  </div>

  <button class="btn-full btn-ver-finalizados" onclick="verFinalizados()">Ver Chamados Finalizados</button>

  <div id="lista">
    <p style="text-align:center;">Carregando chamados...</p>
  </div>
</div>

  render();
