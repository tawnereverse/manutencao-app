<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  background: #1e3a8a;
  margin: 0;
}

/* CONTAINER */
.container {
  max-width: 900px;
  margin: 20px auto;
  background: white;
  color: #1e3a8a;
  padding: 20px;
  border-radius: 12px;
  position: relative;
}

/* LOGO */
.logo {
  width: 120px;
  display: block;
  margin: auto;
}

/* BOTÃO SAIR */
.logout {
  position: absolute;
  top: 15px;
  right: 15px;
  background: #2563eb;
  color: white;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  width: auto;
}

/* BUSCA */
.busca {
  margin-top: 15px;
  display: flex;
  gap: 10px;
}

.busca input {
  flex: 1;
  padding: 8px;
}

.busca button {
  width: 120px;
}

/* DASHBOARD */
.card {
  background: linear-gradient(90deg, #3b82f6, #2563eb);
  color: white;
  padding: 14px;
  margin-top: 10px;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  font-weight: bold;
}

/* CHAMADO */
.chamado {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 14px;
  margin-top: 10px;
}

/* FINALIZADOS LISTA */
.lista-final {
  border: 1px solid #ddd;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  cursor: pointer;
}

.lista-final:hover {
  background: #f1f5f9;
}

/* DETALHE */
.detalhe {
  background: #f0f9ff;
  padding: 10px;
  border-left: 4px solid #2563eb;
  margin-top: 10px;
  border-radius: 6px;
}

/* CAMPOS */
select, textarea, button {
  width: 100%;
  margin-top: 8px;
  padding: 8px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
}

.urgente {
  color: red;
  font-weight: bold;
}
</style>

</head>

<body>

<div class="container">

  <button class="logout" onclick="logout()">Sair</button>

  <img src="logo.png" class="logo">
  <h2 style="text-align:center;">Painel</h2>

  <!-- 🔍 BUSCA -->
  <div class="busca">
    <input type="number" id="buscaId" placeholder="Buscar chamado pelo número">
    <button onclick="buscarChamado()">Buscar</button>
  </div>

  <div id="dashboard"></div>

  <select id="filtroUnidade" onchange="carregarChamados()" style="display:none;"></select>

  <button onclick="verFinalizados()">Ver Finalizados</button>

  <div id="lista"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://kmxmyjvxncteacojmbaj.supabase.co",
  "sb_publishable_OuujR_q1W9R1q9-MJuHPIg_a89r7Y9J"
);

let statusAtual = "";

// LOGOUT
function logout() {
  location.reload();
}

// 🔍 BUSCAR
async function buscarChamado() {
  let id = document.getElementById("buscaId").value;

  if (!id) return;

  let { data } = await supabaseClient
    .from("chamados")
    .select("*")
    .eq("id", id);

  if (!data.length) {
    alert("Chamado não encontrado");
    return;
  }

  let c = data[0];

  lista.innerHTML = `
    <div class="chamado">
      <b>#${c.id}</b><br>
      ${c.descricao}<br><br>

      <b>Unidade:</b> ${c.unidade}<br>
      <b>Setor:</b> ${c.setor}<br>
      <b>Aberto por:</b> ${c.nome}<br>
      <b>Status:</b> ${c.status}<br><br>

      <b>Atendido por:</b> ${c.atendido_por || "-"}<br>
      <b>Solução:</b> ${c.solucao || "-"}
    </div>
  `;
}

// ENTER PRA BUSCAR
document.getElementById("buscaId").addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    buscarChamado();
  }
});

// DASHBOARD
async function carregarDashboard() {
  let { data } = await supabaseClient.from("chamados").select("*");

  let abertos = data.filter(c => c.status === "Aberto").length;
  let andamento = data.filter(c => c.status === "Andamento").length;

  dashboard.innerHTML = `
    <div class="card" onclick="abrirChamados('Aberto')">Abertos: ${abertos}</div>
    <div class="card" onclick="abrirChamados('Andamento')">Em andamento: ${andamento}</div>
  `;
}

// RESTANTE IGUAL (não mexi na lógica base)
function abrirChamados(status) {
  statusAtual = status;
  filtroUnidade.style.display = "block";
  carregarUnidades();
  carregarChamados();
}

async function verFinalizados() {
  statusAtual = "Finalizado";

  let { data } = await supabaseClient
    .from("chamados")
    .select("*")
    .eq("status", "Finalizado")
    .order("id", { ascending: true });

  let html = "<h3>Chamados Finalizados</h3>";

  data.forEach(c => {
    html += `
      <div class="lista-final" onclick="verDetalhe('${c.id}')">
        Nº ${c.id} - ${c.descricao}
        <div id="det_${c.id}" style="display:none;"></div>
      </div>
    `;
  });

  lista.innerHTML = html;
}

async function verDetalhe(id) {
  let { data } = await supabaseClient
    .from("chamados")
    .select("*")
    .eq("id", id);

  let c = data[0];
  let div = document.getElementById("det_" + id);

  div.style.display = div.style.display === "block" ? "none" : "block";

  div.innerHTML = `
    <div class="detalhe">
      <b>Atendido por:</b> ${c.atendido_por || "-"}<br>
      <b>Solução:</b> ${c.solucao || "-"}
    </div>
  `;
}

async function carregarUnidades() {
  let { data } = await supabaseClient.from("chamados").select("unidade");

  let unidades = [...new Set(data.map(c => c.unidade))];

  filtroUnidade.innerHTML = "<option value=''>Todas unidades</option>";

  unidades.forEach(u => {
    filtroUnidade.innerHTML += `<option>${u}</option>`;
  });
}

async function carregarChamados() {
  let unidade = filtroUnidade.value;

  let query = supabaseClient
    .from("chamados")
    .select("*")
    .eq("status", statusAtual)
    .order("id", { ascending: true });

  if (unidade) query = query.eq("unidade", unidade);

  let { data } = await query;

  let html = "";

  data.forEach(c => {
    html += `
      <div class="chamado">
        <b>#${c.id}</b> - ${c.descricao}
      </div>
    `;
  });

  lista.innerHTML = html;
}

carregarDashboard();
</script>

</body>
</html>
