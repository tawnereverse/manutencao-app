<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel Tecnico | Atlantica</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="app-page">
  <header class="top-header">
    <img src="./logo.png" class="brand-logo" alt="Logo Atlantica">
    <div class="header-user">
      <p id="user-name" class="user-name">Carregando...</p>
      <p id="user-role" class="user-role"></p>
    </div>
    <div class="header-actions">
      <a href="./index.html" class="btn-secondary as-button">Novo chamado</a>
      <button id="logout-btn" class="btn-danger" type="button">Sair</button>
    </div>
  </header>

  <main class="page-grid single-column">
    <section class="card">
      <h1>Painel Tecnico</h1>
      <p class="muted">Gerencie status, conclusao e historico dos chamados.</p>

      <div id="dashboard" class="dashboard-grid"></div>

      <form id="search-form" class="top-controls">
        <input id="search-input" placeholder="Buscar por numero, descricao ou solicitante">
        <button type="submit">Buscar</button>
        <button id="clear-search-btn" class="btn-secondary" type="button">Limpar</button>
      </form>

      <div class="filter-row">
        <button class="btn-filter" data-filter="aberto" type="button">Abertos</button>
        <button class="btn-filter" data-filter="andamento" type="button">Em andamento</button>
        <button class="btn-filter" data-filter="finalizado" type="button">Finalizados</button>
      </div>

      <p id="admin-feedback" class="message hidden" role="status" aria-live="polite"></p>
      <div id="admin-tickets" class="ticket-list"></div>
    </section>

    <section id="admin-user-card" class="card hidden">
      <h2>Criar usuario</h2>
      <p class="muted">Esta acao usa API serverless no Vercel com Service Role no backend.</p>

      <form id="create-user-form" class="stack-form">
        <label class="field">
          <span>Nome</span>
          <input id="new-user-name" maxlength="80" required placeholder="Nome completo">
        </label>

        <label class="field">
          <span>E-mail</span>
          <input id="new-user-email" type="email" required placeholder="usuario@empresa.com">
        </label>

        <label class="field">
          <span>Senha temporaria</span>
          <input id="new-user-password" type="password" minlength="8" required placeholder="Minimo 8 caracteres">
        </label>

        <label class="field">
          <span>Perfil</span>
          <select id="new-user-role" required>
            <option value="solicitante">Solicitante</option>
            <option value="tecnico">Tecnico</option>
            <option value="admin">Admin</option>
          </select>
        </label>

        <button id="create-user-btn" type="submit">Criar usuario</button>
      </form>
      <p id="create-user-feedback" class="message hidden" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script type="module" src="./js/admin.js"></script>
</body>
</html>
